<div class="content-container">
  <h1 class="visually-hidden">Projects</h1>
  @for (
    project of projects;
    track project.name;
    let first = $first, last = $last
  ) {
    <div
      [class]="first ? 'timeline-item-projects-top' : 'timeline-item-projects'"
    >
      <div class="left-part scroll-reveal">
        <p class="item-title">{{ project.tech }}</p>
      </div>
      <div [class]="first ? 'divider-top' : 'divider'"></div>
      <div class="right-part scroll-reveal">
        <h2 class="item-title no-margin">{{ project.name }}:</h2>
      </div>
    </div>
    <div
      [class]="
        last ? 'timeline-item-projects-bottom' : 'timeline-item-projects'
      "
    >
      <div class="divider-card"></div>
      <div class="projects-card-container scroll-reveal">
        <div class="custom-card-primary w-100 p-2 hover-card">
          <div class="container-fluid">
            <div class="row g-3">
              <div class="col-sm-6">
                <div class="project-image-frame">
                  <img
                    [src]="project.img1"
                    [alt]="'Screenshot of ' + project.name"
                    loading="lazy"
                    class="project-image"
                  />
                </div>
              </div>
              <div class="col-sm-6">
                <div class="project-image-frame">
                  <img
                    [src]="project.img2"
                    [alt]="'Second screenshot of ' + project.name"
                    loading="lazy"
                    class="project-image"
                  />
                </div>
              </div>
            </div>
            <div class="row mt-3">
              <div class="col">
                <p class="text-inside-description project-description">
                  {{ project.description }}
                </p>
              </div>
            </div>
            <div class="row g-2 mt-2">
              <div class="col-sm-6">
                @if (!project.demoUrl) {
                  <button
                    type="button"
                    class="btn btn-lg btn-primary btn-project"
                    disabled
                  >
                    <span class="btn-project-icon" aria-hidden="true">
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M4.5 4.5l15 15M9.5 5.6A9.8 9.8 0 0 1 12 5.3c5.2 0 8.8 4 9.9 6.2a1 1 0 0 1 0 .9 15 15 0 0 1-2.4 3.3M6.8 7.1C4.4 8.7 2.9 10.8 2.1 12.4a1 1 0 0 0 0 .9C3.2 15.5 6.8 19.5 12 19.5c1.5 0 2.9-.3 4.1-.8"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <path
                          d="M9.9 10.1a3 3 0 0 0 4 4"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    Demo
                    <span class="btn-project-badge">Local only</span>
                    <span class="visually-hidden"
                      >: no public demo of {{ project.name }}</span
                    >
                  </button>
                } @else {
                  <a
                    [href]="project.demoUrl"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-lg btn-primary btn-project"
                  >
                    <span class="btn-project-icon" aria-hidden="true">
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M14 4h6v6"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <path
                          d="M20 4L10.5 13.5"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <path
                          d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    Demo<span class="visually-hidden">
                      of {{ project.name }} (opens in a new tab)</span
                    >
                  </a>
                }
              </div>
              <div class="col-sm-6">
                <a
                  [href]="project.codeUrl"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn btn-lg btn-primary btn-project"
                >
                  <span class="btn-project-icon" aria-hidden="true">
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M9 18c-4.5 1.5-4.5-2.5-6-3m12 8v-3.9c0-1 .3-1.7.7-2.1-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11 11 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.9 1.2 2 1.2 3.2 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.2.8 2.4V23"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </span>
                  Code<span class="visually-hidden">
                    of {{ project.name }} (opens in a new tab)</span
                  >
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
