<nav
  class="navbar navbar-expand-sm navbar-custom-style"
  aria-label="Main navigation"
>
  <a
    routerLink="/"
    class="nav-link navbar-brand-link hover-text-nav"
    (click)="closeMenu()"
  >
    <span
      id="navbarBrand"
      class="brand-logo"
      role="img"
      aria-label="Dan Frunza, home"
    ></span>
  </a>
  <app-hamburger-button
    [isOpen]="isMenuOpen()"
    (toggleMenu)="onToggleMenu($event)"
    controls="main-nav"
  ></app-hamburger-button>

  <div
    class="navbar-collapse justify-content-end"
    [class.show]="isMenuOpen()"
    id="main-nav"
  >
    <ul class="navbar-nav custom-nav-list">
      @for (link of navLinks; track link.path) {
        <li class="nav-item">
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="nav-link hover-text-nav"
            (click)="closeMenu()"
            >{{ link.label }}</a
          >
        </li>
      }
    </ul>
  </div>
</nav>
